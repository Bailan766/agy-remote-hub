<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Antigravity Pocket</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --card-border: #2b3040;
      --primary: #4e80ee;
      --primary-hover: #3b6cd4;
      --accent: #00d2aa;
      --text-main: #f0f3f8;
      --text-muted: #959ea9;
      --danger: #ef4444;
      --nav-height: 60px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: rgba(26, 29, 39, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.3px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #4e80ee, #00d2aa);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .header-status {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      background: rgba(0, 210, 170, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 210, 170, 0.2);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .tab-view {
      display: none;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }
    .tab-view.active {
      display: flex;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Quick Deck Grid */
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .deck-btn {
      background: #232736;
      border: 1px solid #32384c;
      color: var(--text-main);
      padding: 14px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .deck-btn:active {
      transform: scale(0.97);
      background: #2b3042;
      border-color: var(--primary);
    }
    .deck-btn .desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }
    .deck-btn.primary {
      background: linear-gradient(135deg, rgba(78, 128, 238, 0.2), rgba(0, 210, 170, 0.2));
      border-color: rgba(78, 128, 238, 0.4);
      color: #72a4ff;
    }

    /* Live Screen View */
    .screen-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--card-border);
      min-height: 260px;
    }
    #screen-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }
    .screen-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-sm {
      background: #2b3040;
      color: var(--text-main);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* Conversations list */
    .conv-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .conv-item {
      background: #202433;
      border: 1px solid #2e3549;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .conv-item:active {
      border-color: var(--primary);
    }
    .conv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .conv-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-done { background: rgba(0, 210, 170, 0.15); color: var(--accent); }
    .badge-running { background: rgba(78, 128, 238, 0.15); color: #72a4ff; }
    .conv-title {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.3;
      color: #e2e8f0;
    }
    .conv-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Artifact Modal / Viewer */
    .artifact-viewer {
      background: #171a24;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      overflow-y: auto;
      max-height: 400px;
      border: 1px solid #2d3345;
    }
    .artifact-viewer pre {
      background: #0d0f14;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
    }

    /* Bottom Prompt Dock */
    .prompt-dock {
      background: rgba(26, 29, 39, 0.95);
      backdrop-filter: blur(16px);
      padding: 8px 12px 14px 12px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dock-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .chip {
      background: #242938;
      border: 1px solid #363d52;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip:active {
      color: var(--text-main);
      border-color: var(--primary);
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    #prompt-input {
      flex: 1;
      background: #131620;
      border: 1px solid #2e3549;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      outline: none;
    }
    #prompt-input:focus {
      border-color: var(--primary);
    }
    .btn-send {
      background: var(--primary);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-send:active {
      background: var(--primary-hover);
      transform: scale(0.95);
    }

    /* Bottom Navigation Bar */
    nav {
      height: var(--nav-height);
      background: #141721;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 10;
    }
    .nav-btn {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: color 0.15s;
    }
    .nav-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .nav-btn.active {
      color: var(--primary);
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 36, 51, 0.95);
      border: 1px solid var(--primary);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: none;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span>AGY Pocket</span>
    </div>
    <div class="header-status">
      <div class="dot"></div>
      <span id="host-name">已连接电脑</span>
    </div>
  </header>

  <div id="toast"></div>

  <!-- Main Views -->
  <main>
    <!-- View 1: Quick Deck -->
    <div id="view-deck" class="tab-view active">
      <div class="card">
        <div class="card-title">
          <span>核心指令舵</span>
          <span style="font-size: 0.7rem; color: var(--accent);">一键注入电脑端</span>
        </div>
        <div class="deck-grid">
          <button class="deck-btn primary" onclick="sendAction('plan')">
            <span>📐 /plan</span>
            <span class="desc">规划并生成实施方案</span>
          </button>
          <button class="deck-btn primary" onclick="sendAction('goal')">
            <span>🎯 /goal</span>
            <span class="desc">设定自动化目标执行</span>
          </button>
          <button class="deck-btn" onclick="sendAction('proceed')">
            <span>✅ Proceed</span>
            <span class="desc">批准方案 / 继续下一步</span>
          </button>
          <button class="deck-btn" onclick="sendAction('compact')">
            <span>📦 /compact</span>
            <span class="desc">压缩上下文清理缓存</span>
          </button>
          <button class="deck-btn" onclick="sendAction('boost')">
            <span>⚡ /boost</span>
            <span class="desc">深度推演多视角分析</span>
          </button>
          <button class="deck-btn" onclick="toggleKeepAwake()">
            <span>💡 保持常亮</span>
            <span class="desc" id="awake-status">防止电脑睡眠</span>
          </button>
        </div>
      </div>

      <div class="card" style="flex: 1; overflow-y: auto;">
        <div class="card-title">
          <span>最近对话与产物</span>
          <button class="btn-sm" onclick="loadConversations()">刷新</button>
        </div>
        <div id="conv-list" class="conv-list">
          <div style="text-align: center; color: var(--text-muted); padding: 20px;">正在加载对话...</div>
        </div>
      </div>
    </div>

    <!-- View 2: Live Screen Stream -->
    <div id="view-screen" class="tab-view">
      <div class="card" style="padding: 8px;">
        <div class="card-title" style="margin-bottom: 6px;">
          <span>电脑桌面实景画面</span>
          <button class="btn-sm" id="btn-toggle-stream" onclick="toggleScreenStream()">暂停实时流</button>
        </div>
        <div class="screen-container">
          <img id="screen-img" src="" alt="点击刷新画面" onclick="handleScreenTap(event)" />
        </div>
        <div style="font-size: 0.72rem; color: var(--text-muted); text-align: center; margin-top: 6px;">
          👆 提示：在画面上点击任意位置，可远程模拟鼠标点击电脑对应按钮
        </div>
      </div>
    </div>

    <!-- View 3: Artifact Viewer -->
    <div id="view-artifacts" class="tab-view">
      <div class="card" style="height: 100%; display: flex; flex-direction: column;">
        <div class="card-title">
          <span id="artifact-title">产物方案预览</span>
          <button class="btn-sm" onclick="closeArtifactView()">返回列表</button>
        </div>
        <div id="artifact-content" class="artifact-viewer" style="flex: 1;">
          请在列表点击要查看的 Markdown 产物
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Prompt Dock -->
  <div class="prompt-dock">
    <div class="dock-chips">
      <div class="chip" onclick="quickFill('/plan ')">/plan</div>
      <div class="chip" onclick="quickFill('Proceed')">Proceed</div>
      <div class="chip" onclick="quickFill('/goal ')">/goal</div>
      <div class="chip" onclick="quickFill('/compact')">/compact</div>
      <div class="chip" onclick="quickFill('继续执行，注意保持测试通过')">继续执行</div>
      <div class="chip" onclick="quickFill('好的，没问题')">好的</div>
    </div>
    <div class="input-row">
      <input type="text" id="prompt-input" placeholder="向电脑端 Antigravity 发送指令..." onkeydown="if(event.key==='Enter') sendPrompt()" />
      <button class="btn-send" onclick="sendPrompt()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('deck', this)">
      <svg viewBox="0 0 24 24"><path d="M4 13h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zm0 8h6c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1zm10 0h6c.55 0 1-.45 1-1v-8c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zm0-18c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1h-6z"/></svg>
      <span>快捷舵</span>
    </button>
    <button class="nav-btn" onclick="switchTab('screen', this)">
      <svg viewBox="0 0 24 24"><path d="M20 3H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4v2h8v-2h4c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H4V5h16v12z"/></svg>
      <span>实景画面</span>
    </button>
  </nav>

  <script>
    // Extract token from URL or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    let token = urlParams.get('token') || localStorage.getItem('agy_token') || '';
    if (token) localStorage.setItem('agy_token', token);

    let screenStreaming = true;
    let screenInterval = null;
    let keepAwakeState = true;

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      if (tabId === 'deck') {
        document.getElementById('view-deck').classList.add('active');
      } else if (tabId === 'screen') {
        document.getElementById('view-screen').classList.add('active');
        refreshScreen();
      }
      if (el) el.classList.add('active');
    }

    async function apiFetch(endpoint, options = {}) {
      const headers = options.headers || {};
      headers['X-Auth-Token'] = token;
      options.headers = headers;
      const resp = await fetch(endpoint, options);
      if (resp.status === 401) {
        showToast('认证失败，请重新扫码');
        throw new Error('Unauthorized');
      }
      return resp;
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;
      
      try {
        const resp = await apiFetch('/api/send_prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, auto_submit: true })
        });
        if (resp.ok) {
          showToast('已注入电脑端发送');
          input.value = '';
          setTimeout(loadConversations, 1000);
        }
      } catch (e) {
        showToast('发送失败: ' + e);
      }
    }

    function quickFill(text) {
      const input = document.getElementById('prompt-input');
      input.value = text;
      input.focus();
    }

    async function sendAction(act) {
      try {
        const resp = await apiFetch('/api/quick_action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: act })
        });
        if (resp.ok) {
          showToast('已触发: ' + act);
          setTimeout(loadConversations, 1000);
        }
      } catch (e) {
        showToast('操作失败: ' + e);
      }
    }

    async function toggleKeepAwake() {
      keepAwakeState = !keepAwakeState;
      try {
        await apiFetch('/api/quick_action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'keep_awake', param: String(keepAwakeState) })
        });
        document.getElementById('awake-status').innerText = keepAwakeState ? '防止电脑睡眠' : '常亮已关闭';
        showToast(keepAwakeState ? '电脑常亮已开启' : '常亮已恢复默认');
      } catch (e) {
        showToast('修改失败');
      }
    }

    async function loadConversations() {
      try {
        const resp = await apiFetch('/api/conversations');
        const data = await resp.json();
        const listEl = document.getElementById('conv-list');
        listEl.innerHTML = '';
        
        if (!data.conversations || data.conversations.length === 0) {
          listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">暂无历史会话</div>';
          return;
        }

        data.conversations.forEach(c => {
          const item = document.createElement('div');
          item.className = 'conv-item';
          const isDone = c.status === 'DONE';
          item.innerHTML = `
            <div class="conv-header">
              <span class="conv-badge ${isDone ? 'badge-done' : 'badge-running'}">${c.status}</span>
              <span class="conv-time">${c.updated_at}</span>
            </div>
            <div class="conv-title">${c.title}</div>
            ${c.artifacts && c.artifacts.length ? `<div style="font-size:0.72rem; color: #72a4ff; margin-top:4px;">📄 产物文档 (${c.artifacts.length} 个)</div>` : ''}
          `;
          item.onclick = () => openConversation(c.id);
          listEl.appendChild(item);
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function openConversation(convId) {
      try {
        const resp = await apiFetch('/api/conversations/' + convId);
        const data = await resp.json();
        if (data.artifacts && data.artifacts.length) {
          const art = data.artifacts[0];
          document.getElementById('artifact-title').innerText = art.filename;
          document.getElementById('artifact-content').innerHTML = marked.parse(art.content);
          
          document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
          document.getElementById('view-artifacts').classList.add('active');
        } else {
          showToast('该会话暂无 Markdown 产物');
        }
      } catch (e) {
        showToast('加载详情失败');
      }
    }

    function closeArtifactView() {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-deck').classList.add('active');
    }

    // Live Screen Stream
    function refreshScreen() {
      const img = document.getElementById('screen-img');
      img.src = '/api/screen/shot.jpg?token=' + encodeURIComponent(token) + '&_t=' + Date.now();
    }

    function toggleScreenStream() {
      screenStreaming = !screenStreaming;
      const btn = document.getElementById('btn-toggle-stream');
      if (screenStreaming) {
        btn.innerText = '暂停实时流';
        startStreamLoop();
      } else {
        btn.innerText = '开启实时流';
        clearInterval(screenInterval);
      }
    }

    function startStreamLoop() {
      clearInterval(screenInterval);
      screenInterval = setInterval(() => {
        if (screenStreaming && document.getElementById('view-screen').classList.contains('active')) {
          refreshScreen();
        }
      }, 1000);
    }

    async function handleScreenTap(event) {
      const img = event.target;
      const rect = img.getBoundingClientRect();
      const normX = (event.clientX - rect.left) / rect.width;
      const normY = (event.clientY - rect.top) / rect.height;

      try {
        await apiFetch('/api/screen/tap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x: normX, y: normY })
        });
        showToast('已模拟点击');
        setTimeout(refreshScreen, 300);
      } catch (e) {
        showToast('点击触发失败');
      }
    }

    // Init
    window.onload = () => {
      loadConversations();
      startStreamLoop();
      setInterval(loadConversations, 5000);
    };
  </script>
</body>
</html>
